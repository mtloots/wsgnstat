# Build binary wheels and the sdist for the Python front, wsgnstat-py.
#
# MANUAL ONLY (workflow_dispatch). Trigger it before a PyPI release; the artefacts are uploaded to
# the run. Linux x86_64 and macOS arm64, CPython 3.10 to 3.13, matching the package's classifiers.
#
# OPENMP. setup.py builds the C with OpenMP where the compiler has it and falls back to a serial
# library otherwise (the build never fails for lack of OpenMP). LINUX wheels are built with OpenMP
# (gcc -fopenmp inside the manylinux image); auditwheel, cibuildwheel's default repair step, copies
# libgomp into the wheel, and the test command asserts wsgnstat.HAS_OPENMP so that a wheel that
# silently fell back to serial fails the workflow. macOS wheels are deliberately SERIAL
# (WSGN_OPENMP=0): a bundled libomp collides with the copy that scikit-learn or PyTorch load into
# the same process ("OMP: Error #15"), and delocate refuses a libomp built for a newer macOS than
# the wheel's deployment target. macOS users who want threads build from the sdist with
# WSGN_OPENMP=1 and Homebrew's libomp.
#
# PUBLISHING. The publish job uses PyPI trusted publishing and runs only when BOTH the `publish`
# input is ticked AND the repository variable PYPI_PUBLISHER_READY is 'true'. Set that variable
# only after a (pending) publisher for project wsgnstat, repository mtloots/wsgnstat, workflow
# Wheels.yaml has been added on PyPI; until then the job is skipped. The alternative route, used
# for exactcond, is to download the artefacts and upload them with twine and the token in
# ~/.pypirc.
name: wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: publish to PyPI after building (trusted publishing, no token)
        required: true
        default: false
        type: boolean

permissions: read-all

jobs:
  build:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: wsgnstat-py
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-*
          CIBW_SKIP: "*-musllinux_* *_i686"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ENVIRONMENT_LINUX: WSGN_OPENMP=1
          CIBW_ENVIRONMENT_MACOS: WSGN_OPENMP=0
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND_LINUX: >-
            python -c "import wsgnstat; assert wsgnstat.HAS_OPENMP, 'Linux wheel built without OpenMP'" &&
            python -m pytest -q {package}/tests
          CIBW_TEST_COMMAND_MACOS: >-
            python -c "import wsgnstat; assert not wsgnstat.HAS_OPENMP" &&
            python -m pytest -q {package}/tests

      - name: Build sdist
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir wheelhouse wsgnstat-py

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wsgnstat-py-${{ matrix.os }}
          path: ./wheelhouse/*

  publish:
    name: publish wsgnstat to PyPI
    needs: build
    if: inputs.publish && vars.PYPI_PUBLISHER_READY == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-wsgnstat-py-*
          path: dist
          merge-multiple: true
      - name: What is about to be published
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
